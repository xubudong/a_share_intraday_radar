<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A股个股盘中买点雷达</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260901-1" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>A股个股盘中买点雷达</h1>
        <div class="meta">
          <span id="sessionBadge" class="badge neutral">状态</span>
          <span id="lastUpdated">等待刷新</span>
          <span id="dataStatus">数据源：--</span>
        </div>
      </div>
      <div class="actions">
        <a class="text-btn nav-btn" href="/market">市场</a>
        <button id="refreshBtn" class="icon-btn" title="刷新行情" aria-label="刷新行情">↻</button>
        <button id="historyBtn" class="text-btn">刷新日K</button>
        <button id="snapshotBtn" class="text-btn" title="查看历史快照">历史快照</button>
      </div>
    </header>

    <main>
      <section class="summary-grid" id="summaryGrid"></section>
      <section class="market-index-panel" id="marketIndexPanel"></section>

      <section class="panel radar-panel collapsed" id="radarPanel">
        <div class="panel-head">
          <div class="panel-title-row">
            <h2>今日买点雷达</h2>
            <span id="radarCount" class="muted"></span>
          </div>
          <button id="radarToggle" class="text-btn compact" type="button" aria-expanded="false">展开</button>
        </div>
        <div id="radarList" class="radar-list"></div>
      </section>

      <section class="sector-workspace">
        <div class="sector-picker">
          <div class="workspace-head">
            <div>
              <h2>板块选择</h2>
              <span class="muted">点击一级板块、二级行业、三级赛道或主题切换标的与笔记</span>
            </div>
          </div>
          <div class="segmented" id="groupFilter"></div>
        </div>

        <aside class="notes-panel">
          <div class="notes-head">
            <div>
              <div class="notes-kicker">研究日志</div>
              <h2 id="noteScopeTitle">全部</h2>
            </div>
            <span class="muted">每日一条</span>
          </div>
          <div class="note-editor">
            <input id="noteDate" class="note-date" type="date" />
            <textarea
              id="noteContent"
              rows="4"
              maxlength="20000"
              placeholder="记录板块强弱、驱动因素、预期差和明日观察点..."
            ></textarea>
            <div class="note-editor-actions">
              <span id="noteStatus" class="muted"></span>
              <button id="noteTodayBtn" class="text-btn" type="button">今天</button>
              <button id="noteSaveBtn" class="text-btn primary" type="button">保存笔记</button>
            </div>
          </div>
          <div id="noteTimeline" class="note-timeline"></div>
        </aside>
      </section>

      <section class="toolbar table-toolbar">
        <span class="muted">标的筛选</span>
        <div class="filters">
          <label><input type="checkbox" id="starOnly" /> 星标</label>
          <label><input type="checkbox" id="holdingOnly" /> 持仓</label>
          <label><input type="checkbox" id="actionableOnly" /> 买入</label>
          <label><input type="checkbox" id="reduceOnly" /> 减仓</label>
          <input id="searchInput" class="search" type="search" placeholder="代码 / 名称" />
          <details class="column-picker">
            <summary>显示列</summary>
            <div id="columnToggles" class="column-toggle-list"></div>
          </details>
        </div>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-code">标的</th>
              <th class="col-group">分组</th>
              <th class="col-tier sortable" data-sort="tier">梯度</th>
              <th class="col-price sortable" data-sort="price">价格</th>
              <th class="col-pct sortable" data-sort="pct_chg">涨跌幅</th>
              <th class="col-return-5d sortable" data-sort="return_5d">5日涨幅</th>
              <th class="col-return-20d sortable" data-sort="return_20d">20日涨幅</th>
              <th class="col-sparkline">走势</th>
              <th class="col-market-cap sortable" data-sort="market_cap">市值(亿)</th>
              <th class="col-amount sortable" data-sort="amount">成交额</th>
              <th class="col-main-inflow sortable" data-sort="main_net_inflow">主力净流入</th>
              <th class="col-ma5-pos sortable" data-sort="dev_ma5">MA5</th>
              <th class="col-ma10-pos sortable" data-sort="dev_ma10">MA10</th>
              <th class="col-ma20-pos sortable" data-sort="dev_ma20">MA20</th>
              <th class="col-ma5-slope sortable" data-sort="ma5_slope">MA5斜率</th>
              <th class="col-ma10-slope sortable" data-sort="ma10_slope">MA10斜率</th>
              <th class="col-ma20-slope sortable" data-sort="ma20_slope">MA20斜率</th>
              <th class="col-rsi sortable" data-sort="rsi14">RSI</th>
              <th class="col-volume-ratio sortable" data-sort="volume_ratio">量比</th>
              <th class="col-signal sortable" data-sort="signal">信号</th>
              <th class="col-signal-detail hidden-col">信号说明</th>
              <th class="col-action hidden-col">动作</th>
            </tr>
          </thead>
          <tbody id="stockBody"></tbody>
        </table>
      </section>
    </main>

    <div id="snapshotOverlay" class="overlay hidden">
      <div class="overlay-card">
        <div class="overlay-head">
          <h2>历史快照</h2>
          <button id="snapshotClose" class="icon-btn" aria-label="关闭">✕</button>
        </div>
        <div id="snapshotList" class="snapshot-list"></div>
      </div>
    </div>

    <script src="/static/app.js?v=20260901-1"></script>
  </body>
</html>
